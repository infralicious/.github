# Private repos only. This suborg has no branch rules on purpose.
# Branch protection fails on private repos on the free plan.
# The API returns 403 for branch protection on private free repos.
# This suborg still gets the org baseline: repo settings and labels.
# It does not get branch rules.
# Add a private repo here only after a dry run passes for it.
suborgrepos:
  - service-control-policies

# Branches, commented out on purpose, not missing.
# Branch protection fails on private repos on the free plan, the API returns 403.
# Keep this suborg without branch rules, even if more private repos are added.
# branches:
#   - name: main
#     protection:
#       required_status_checks: null
#       enforce_admins: false
#       required_pull_request_reviews: null
#       restrictions: null
# Suborg grouping keys, commented out on purpose.
# suborgteams: unused, org has no teams today.
# suborgproperties: unused, org has no custom properties today.
