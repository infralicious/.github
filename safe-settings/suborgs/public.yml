# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/suborgs.json
# Public repos only. Rulesets work on the free plan for public repos.
# This suborg adds rulesets to the org baseline.
# The org baseline has no rulesets.
# That split keeps private repos out of branch ruleset failures.
# Rulesets for all six public repos, migrated 2026-10-27.
# Rulesets use the same weak settings as old branch protection.
# No required reviews, no required checks, for the sole maintainer.
# Rulesets still block force push and deletion, for main.
# Baseline repo settings, labels, and alerts still apply to all installed repos.
# Rulesets apply only when the App is installed on a repo.
suborgrepos:
  - infralicious.github.io
  - actions-checkout
  - awesome-service-control-policies
  - saas-auth-wall-of-shame
  - terraform-aws-securityhub-batchupdatefindings
  - renovate-config
# Suborg grouping keys below are commented out on purpose, not missing.
# suborgteams: unused, org has no teams today, so no team can select repos for this suborg.
# suborgproperties: unused, org has no custom properties today, so no property can select repos.
# Glob patterns in suborgrepos: unused on purpose, exact repo names are clearer for seven managed repos.
# Branch protection is gone, rulesets replace it, migrated 2026-10-27.
# Do not re-add branches here, rulesets are the only protection model now.
# Admin repo is the one exception, it is restricted and set by hand.
rulesets:
  - name: Protect main
    target: branch
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: always
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
