# Rulesets for terraform-aws-securityhub-batchupdatefindings, migrated 2026-10-27.
# No repository fields live here, only rulesets, so identity stays unchanged.
# Default was manual before, now it is in code, with live parameters exactly.
# Default target is the default branch, by name, see migration doc for the API gap.
# API returns conditions empty for Default, UI target was not confirmed in this run.
# Default branch target is the safe choice, repo has only main today.
# Protect main comes from the public suborg, it is not listed here again.
# Protect tags covers all tags, terraform tags are bare numbers, not v prefixed.
rulesets:
  - name: Default
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: false
          dismissal_restriction:
            allowed_actors: []
            enabled: false
          require_code_owner_review: false
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
  - name: Protect tags
    target: tag
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: always
    conditions:
      ref_name:
        include:
          - refs/tags/*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
