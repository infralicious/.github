# Override for service-control-policies. Only identity fields live here.
# All other fields come from the baseline and the private suborg.
# Private stays true on purpose.
# That setting lets sync revert an accidental public flip.
repository:
  name: service-control-policies
  description: service-control-policies or SCPs
  private: true

# Push ruleset for this private repo, migrated 2026-10-27.
# Push rulesets do not work on public repos, GitHub refuses them with 422.
# This private repo is the only repo where a push ruleset is applicable.
# Push ruleset blocks private key file extensions, for all pushes.
# Admin bypass is always, so an admin can override in an emergency.
# No branch ruleset here, private repos have no branch rulesets on the free plan.
rulesets:
  - name: Protect pushes
    target: push
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: always
    conditions: {}
    rules:
      - type: file_extension_restriction
        parameters:
          restricted_file_extensions:
            - "*.pem"
            - "*.key"
