# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/repos.json
# Override for service-control-policies. Only identity fields live here.
# All other fields come from the baseline and the private suborg.
# Private stays true on purpose.
# That setting lets sync revert an accidental public flip.
# allow_forking false, 2026-10-29: private repo must not be forked to a personal account.
# Public repos keep forking on via default, baseline does not set allow_forking.
repository:
  name: service-control-policies
  description: service-control-policies or SCPs
  private: true
  allow_forking: false

# No rulesets here, private repos have no rulesets on the free plan.
# Push rulesets also return 403 for private repos on the free plan, verified 2026-10-27.
# Live sync run 40608650379 failed only on this repo, for that reason.
# Public repos got their rulesets in that run, this repo got none, and that is correct.
