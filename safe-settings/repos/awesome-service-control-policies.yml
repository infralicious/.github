# Rulesets for awesome-service-control-policies, migrated 2026-10-27.
# No repository fields live here, only rulesets, so identity stays unchanged.

# Tag ruleset for this repo, migrated 2026-10-27.
# Protect tags covers all tags, with deletion, non-fast-forward, and update rules.
# Admin bypass is always, to match old branch protection admin exemption.
# Protect main comes from the public suborg, it is not listed here again.
rulesets:
  - name: Protect tags
    target: tag
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: always
    conditions:
      ref_name:
        include:
          - refs/tags/*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
