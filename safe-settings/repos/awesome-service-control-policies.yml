# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/repos.json
# Rulesets for awesome-service-control-policies, migrated 2026-10-27.
# Identity fields live here now, 2026-10-29, to lock live topics in YAML.
# Topics were live but unmanaged before, sync would not restore a deleted topic.
repository:
  name: awesome-service-control-policies
  description: Awesome AWS service control policies (SCPs), Resource Control Policies (RCPs), and other organizational policies
  private: false
  topics:
    - control-policies
    - control-policy
    - declarative-policies
    - declarative-policy
    - gliderail
    - gliderails
    - guardrail
    - guardrails
    - resource-control-policies
    - resource-control-policy
    - service-control-policies
    - service-control-policy


# Tag ruleset for this repo, migrated 2026-10-27.
# Protect tags covers all tags, with deletion, non-fast-forward, and update rules.
# Bypass actors are empty on purpose, to match actions-checkout Tag protection.
# Tag creation still works, no creation rule exists in this ruleset.
# Deletion and update are blocked even for admin, by design.
# Protect main comes from the public suborg, it is not listed here again.
rulesets:
  - name: Protect tags
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - refs/tags/*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
