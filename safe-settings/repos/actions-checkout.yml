# Override for actions-checkout. Only identity fields live here.
# All other fields come from the baseline in settings.yml.
repository:
  name: actions-checkout
  description: Checkout action with persist-credentials false by default, pinned to actions/checkout
  private: false
  topics:
    - checkout
    - github-actions
    - security
# Rulesets, commented out on purpose for this repo.
# This repo already has a manual Tag protection ruleset for tags v*, with deletion, non-fast-forward, and update rules.
# Safe-settings ruleset sync in normal mode would delete that ruleset if it is not listed in YAML.
# Do not enable rulesets for this repo until that manual ruleset is imported into YAML exactly.
