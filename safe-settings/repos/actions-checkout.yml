# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/repos.json
# Override for actions-checkout. Only identity fields live here.
# All other fields come from the baseline in settings.yml.
repository:
  name: actions-checkout
  description: Checkout action with persist-credentials false by default, pinned to actions/checkout
  private: false
  topics:
    - checkout
    - github-actions
    - security
# Rulesets for this repo, imported exactly from live, migrated 2026-10-27.
# Tag protection was manual before, now it is in code, with the same rules.
# Tag protection covers tags v*, with deletion, non-fast-forward, and update rules.
# Bypass actors are empty on purpose, to match live, no one can bypass tag rules.
# Protect main comes from the public suborg, it is not listed here again.
# Required checks live in a separate ruleset, not in Protect main.
# A separate ruleset avoids a Protect main override, per ADR-0014.
# Action PRs run test on pull_request, job test.
# Required check blocks merge when test fails.
rulesets:
  - name: Require action checks
    target: branch
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: test
              integration_id: 15368
  - name: Tag protection
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - refs/tags/v*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
