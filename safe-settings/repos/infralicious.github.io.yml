# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/repos.json
# Override for infralicious.github.io. Only identity fields live here.
# All other fields come from the baseline in settings.yml.
repository:
  name: infralicious.github.io
  description: Infralicious website and TrueTime docs
  homepage: https://infralicious.com/
  private: false
  topics:
    - jekyll
    - github-pages
    - documentation

# Tag ruleset for this repo, migrated 2026-10-27.
# Protect tags covers all tags, with deletion, non-fast-forward, and update rules.
# Bypass actors are empty on purpose, to match actions-checkout Tag protection.
# Tag creation still works, no creation rule exists in this ruleset.
# Deletion and update are blocked even for admin, by design.
# Protect main comes from the public suborg, it is not listed here again.
# Required checks live in a separate ruleset, not in Protect main.
# A separate ruleset avoids a Protect main override, per ADR-0014.
# Site PRs run link-check on pull_request, job htmlproofer.
# Required check blocks merge when htmlproofer fails, as in Renovate PR 10.
rulesets:
  - name: Require site checks
    target: branch
    enforcement: active
    bypass_actors:
      - actor_type: RepositoryRole
        name: admin
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: htmlproofer
              integration_id: 15368
  - name: Protect tags
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - refs/tags/*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
