# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/a9a1f366ad6a738b55682d346d94f8d6c4893b09/schema/dereferenced/repos.json
# Override for infralicious.github.io. Only identity fields live here.
# All other fields come from the baseline in settings.yml.
repository:
  name: infralicious.github.io
  description: Infralicious website and TrueTime docs
  homepage: https://infralicious.com/
  private: false
  topics:
    - jekyll
    - github-pages
    - documentation

# Tag ruleset for this repo, migrated 2026-10-27.
# Protect tags covers all tags, with deletion, non-fast-forward, and update rules.
# Bypass actors are empty on purpose, to match actions-checkout Tag protection.
# Tag creation still works, no creation rule exists in this ruleset.
# Deletion and update are blocked even for admin, by design.
# Protect main comes from public-infralicious.github.io suborg, with required check htmlproofer, not from public suborg.
# Protect main is not listed here again, to avoid a duplicate ruleset name for this repo.
rulesets:
  - name: Protect tags
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - refs/tags/*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
