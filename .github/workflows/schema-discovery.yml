name: Schema Discovery
on:
  pull_request:
    branches: [main]
jobs:
  schemaDiscovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run schema discovery check, no dependency
        run: python3 scripts/check-schema.py
