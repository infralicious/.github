name: Config Guard
on:
  pull_request:
    branches: [main]
jobs:
  configGuard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run local config guard
        run: python3 scripts/check-config.py guard
  prConfigSimulation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulate PR rulesets against live rulesets
        run: python3 scripts/check-config.py simulate
        env:
          GITHUB_TOKEN: ${{ github.token }}
