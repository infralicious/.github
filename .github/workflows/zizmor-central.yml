# Central zizmor audit, via a GitHub App, like safe-settings.
# Runs on schedule, weekly, plus workflow_dispatch, in admin repo only.
# No per-repo workflow file needed, for coverage, script lists org repos dynamically.
# App exists now, and it is installed org-wide.
# Token creation uses client-id, not app-id, to avoid the deprecation warning.
# Schedule runs weekly, and manual dispatch also works.
# Audit mode first: script exits 0, even with findings, report only, no SARIF upload yet.
# SARIF upload needs security-events write, in App permissions, and script upload mode, in a separate PR.
name: Zizmor central
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
concurrency:
  group: zizmor-central
  cancel-in-progress: false
jobs:
  zizmorCentral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create App token, for all org repos
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZIZMOR_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.ZIZMOR_PRIVATE_KEY }}
          owner: infralicious
          permission-contents: read
          permission-metadata: read
          permission-security-events: write
      - name: Download zizmor binary, version pinned
        run: |
          curl -sL https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o /tmp/zizmor.tar.gz
          tar -xzf /tmp/zizmor.tar.gz -C /tmp
          chmod +x /tmp/zizmor
          /tmp/zizmor --version
      - name: Run central zizmor audit, report only
        run: python3 scripts/zizmor-central.py
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZIZMOR_BIN: /tmp/zizmor
