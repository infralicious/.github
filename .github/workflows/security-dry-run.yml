name: Security Dry Run
on:
  pull_request:
    branches: [main]
jobs:
  securityDryRun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: 22
      - name: Run security dry run, no live change
        run: node scripts/security.js --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
