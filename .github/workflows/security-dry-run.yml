name: Security Dry Run
on:
  pull_request:
    branches: [main]
jobs:
  securityDryRun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create App token, read live security settings
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SAFE_SETTINGS_APP_ID }}
          private-key: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          owner: infralicious
          repositories: |
            .github
            actions-checkout
            awesome-service-control-policies
            infralicious.github.io
            renovate-config
            saas-auth-wall-of-shame
            terraform-aws-securityhub-batchupdatefindings
      - name: Run security dry run, no live change
        run: node scripts/security.js --dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
