name: Script Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scriptTests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run JS script tests, no dependency
        run: node --test scripts/security.test.js
      - name: Check Python guard compiles
        run: python3 -m py_compile scripts/check-config.py
      - name: Check App drift script compiles
        run: python3 -m py_compile scripts/check-apps.py
      - name: Run App drift unit tests, no dependency
        run: python3 scripts/check-apps.test.py
      - name: Check Zizmor central script compiles
        run: python3 -m py_compile scripts/zizmor-central.py
      - name: Run Zizmor central unit tests, no dependency
        run: python3 scripts/zizmor-central.test.py
      - name: Check Manifest linter compiles
        run: python3 -m py_compile scripts/check-manifests.py
      - name: Run Manifest linter unit tests, no dependency
        run: python3 scripts/check-manifests.test.py
      - name: Lint every App manifest, no dependency
        run: python3 scripts/check-manifests.py
