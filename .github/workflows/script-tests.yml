name: Script Tests
on:
  pull_request:
    branches: [main]
jobs:
  scriptTests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: 22
      - name: Run JS script tests, no dependency
        run: node --test scripts/security.test.js
      - name: Check Python guard compiles
        run: python3 -m py_compile scripts/check-config.py
