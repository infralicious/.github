# Pre-commit hooks for this repo. Optional, CI is the gate.
# CI runs the same guard script, so a commit that skips pre-commit
# still fails in CI, before merge, if it breaks an invariant.
# Install once, on a machine with pre-commit: pre-commit install
# Run on all files: pre-commit run --all-files
# Phone-first work cannot run pre-commit, so never require it locally.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: config-guard
        name: config-guard
        entry: python3 scripts/check-config.py guard
        language: system
        pass_filenames: false
        always_run: true
